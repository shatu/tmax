[project]
name = "tmax"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harbor",
    "litellm",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.6.8",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["Vanillux2Agent", "rl_data", "rl_data.generator"]

[project.optional-dependencies]
# Harbor sandbox backends whose vendor SDK is an optional import. Kept as our
# own extras rather than `harbor[modal]` so `uv lock` cannot re-resolve harbor
# itself off the pinned version.
modal = [
    "modal>=1.4.0",
]
rl_data = [
    "litellm",
    "pydantic",
    "tenacity",
    "tqdm",
    "datasets",
    "matplotlib",
]
